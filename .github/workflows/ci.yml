name: CI/CD com gates de segurança

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 app/ --max-line-length=100

      - name: Testes (pytest)
        run: pytest app/

      - name: SAST - análise estática de segurança (Bandit)
        run: bandit -r app/ -f screen --exclude app/test_app.py

      - name: Build da imagem Docker
        run: docker build -t docker-secure-app:ci .

      - name: Scan de vulnerabilidades da imagem (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: docker-secure-app:ci
          severity: CRITICAL,HIGH
          exit-code: 1